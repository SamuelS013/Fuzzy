<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#202727">
    <meta name="description" content="Fuzzy, descargador de contenido multimedia. Consulta el código o descarga la aplicación para Windows.">
    <title>Fuzzy — Descargador multimedia</title>
    <link rel="icon" href="css/img/logo.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="landing">
        <header class="brand">
            <img class="brand__logo" src="css/img/logo.png" alt="Logo de Fuzzy" width="72" height="72">
            <p class="brand__eyebrow">DESCARGADOR MULTIMEDIA</p>
            <h1>Fuzzy</h1>
        </header>

        <aside class="notice" aria-label="Aviso sobre el estado de Fuzzy">
            <span class="notice__status">NOTA:</span>
            <p>Fuzzy sigue en desarrollo. Es posible que encuentres algunos errores mientras trabajo para convertirla en una gran aplicación.</p>
        </aside>

        <section class="actions" aria-label="Enlaces de Fuzzy">
            <!-- Enlace al repositorio de GitHub: edita esta URL para cambiarlo. -->
            <a class="action-card action-card--source" href="https://github.com/SamuelS013/Fuzzy" target="_blank" rel="noopener noreferrer">
                <span class="action-card__icon" aria-hidden="true">&lt;/&gt;</span>
                <span class="action-card__title">Ver código</span>
                <span class="action-card__description">Explora el proyecto en GitHub</span>
                <span class="action-card__link">Abrir repositorio <span aria-hidden="true">↗</span></span>
            </a>

            <a class="action-card action-card--download" href="https://github.com/SamuelS013/Fuzzy/releases/latest/download/Fuzzy.exe" aria-label="Descargar Fuzzy para Windows">
                <span class="action-card__icon action-card__icon--download" aria-hidden="true">↓</span>
                <span class="action-card__title">Descargar Fuzzy</span>
                <span class="action-card__description">Aplicación para Windows · .exe</span>
                <span class="action-card__link">Descarga directa <span aria-hidden="true">↓</span></span>
            </a>
        </section>
    </main>
</body>
</html>
